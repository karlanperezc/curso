<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Extractor de texto PDF</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 300px; margin-top: 16px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Extractor de texto PDF</h1>

  <form method="post" enctype="multipart/form-data">
    <input type="file" name="pdf_file" accept="application/pdf" required>
    <button type="submit">Subir y extraer</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if filename %}
    <p>Archivo procesado: <strong>{{ filename }}</strong></p>
    <textarea readonly>{{ extracted_text }}</textarea>
  {% endif %}
</body>
</html>
